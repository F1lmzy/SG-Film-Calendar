name: Daily SG Film Calendar Scrape

on:
  schedule:
    - cron: "0 22 * * *" # 6 AM SGT (UTC+8) = 10 PM UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write # commit the updated film history back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync

      - name: Run scraper (Filmhouse.sg + Singapore Film Society)
        env:
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_CREDENTIALS: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
          CLEANUP_STALE_SFS: "true"
          PYTHONPATH: src
        run: uv run python src/main.py

      - name: Commit updated film history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/films.csv
          if git diff --staged --quiet; then
            echo "No changes to film history."
          else
            git commit -m "chore(data): update film history $(date -u +%Y-%m-%d)"
            git push
          fi
